services:
  postgres:
    image: postgres:15-alpine
    container_name: nestjs_template_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-nestjs_template}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Opt-in: `docker compose --profile app up -d --build` builds and runs the API image.
  # The default `docker compose up -d postgres` still starts only the database.
  app:
    profiles: ['app']
    build: .
    container_name: nestjs_template_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the database is reachable by its service name.
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-nestjs_template}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
