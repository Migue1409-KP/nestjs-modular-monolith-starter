version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Majors need a planned migration (see ROADMAP.md): stay on Nest 11.x.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      # zod 4 changes the API (required_error, ZodError.errors, ...).
      - dependency-name: zod
        update-types: ['version-update:semver-major']
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      aws-sdk:
        patterns: ['@aws-sdk/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # Keep the image on the LTS line declared in `engines` / .nvmrc.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
