name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: nestjs_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      # Dummy values only (nothing here is a real secret). Exported after the unit tests on purpose:
      # some specs assert that a missing secret throws, and ConfigService also reads process.env.
      # The e2e suite pins the rest in test/e2e-setup.ts.
      - name: Export test environment
        run: |
          {
            echo "NODE_ENV=development"
            echo "DB_HOST=localhost"
            echo "DB_PORT=5432"
            echo "DB_USERNAME=postgres"
            echo "DB_PASSWORD=secret"
            echo "DB_NAME=nestjs_template"
            echo "DATABASE_URL=postgresql://postgres:secret@localhost:5432/nestjs_template"
            echo "BETTER_AUTH_SECRET=ci-better-auth-secret-0123456789abcdef"
            echo "MAGIC_LINK_SECRET=ci-magic-link-secret-0123456789abcdef"
            echo "API_KEY=ci-api-key-0123456789"
            echo "FRONTEND_URL=http://localhost:3001"
          } >> "$GITHUB_ENV"

      - name: Prepare database (Better Auth + TypeORM migrations + seeds)
        run: |
          npm run auth:migrate -- --yes
          npm run migration:run
          npm run seed

      - name: E2E tests
        run: npm run test:e2e

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Informational until the existing advisories are resolved (see ROADMAP v1.1); then drop continue-on-error.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
