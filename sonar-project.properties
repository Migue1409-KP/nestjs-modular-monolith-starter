# ── Identidad del proyecto ────────────────────────────────────────────────
sonar.projectKey=nestjs-modular-starter
sonar.projectName=NestJS Modular Monolith Starter
sonar.projectVersion=1.0.0

# ── Servidor ──────────────────────────────────────────────────────────────
# Instancia local levantada con docker-compose.sonarqube.yml.
sonar.host.url=http://localhost:9000

# ── Qué se analiza ────────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.spec.ts
sonar.sourceEncoding=UTF-8

# ── Qué se ignora por completo ────────────────────────────────────────────
sonar.exclusions=node_modules/**,dist/**,coverage/**,src/core/database/migrations/**,src/core/database/seeders/**

# ── Cobertura (se genera con `npm run test:cov`) ──────────────────────────
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Archivos declarativos o de arranque que no tiene sentido cubrir con tests.
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts,src/**/*.dto.ts,src/**/*.entity.ts,src/core/database/**,test/**

# ── SCM ───────────────────────────────────────────────────────────────────
sonar.scm.provider=git
